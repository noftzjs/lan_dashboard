<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &middot; 4L Dashboard</title>
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        /* Centred on the page rather than sat at the top: there is nothing
           else here to read, so anything else would just be empty space above
           the only thing that matters. */
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
        .signin { width: 100%; max-width: 380px; }
        .signin h1 { font-size: 20px; margin: 0 0 4px; color: var(--accent-color); }
        .signin p.sub { margin: 0 0 22px; color: var(--text-muted); font-size: 13px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .field input {
            width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px;
            font-family: inherit; color: var(--text-color);
            background-color: var(--card-color);
            border: 1px solid var(--border-color); border-radius: 8px;
        }
        .field input:focus-visible { outline: 2px solid var(--accent-color); outline-offset: -1px; }
        .signin button {
            width: 100%; padding: 11px; font-size: 14px; font-weight: 600; font-family: inherit;
            color: #000; background-color: var(--accent-color);
            border: none; border-radius: 8px; cursor: pointer;
        }
        .signin button[disabled] { background-color: var(--border-color); color: var(--text-muted); cursor: default; }
        /* Reserves its line so the form does not jump when a message appears. */
        .msg { min-height: 18px; margin: 12px 0 0; font-size: 13px; color: var(--live-color); }
        .back { display: block; margin-top: 20px; font-size: 12.5px; color: var(--text-muted); text-decoration: none; }
        .back:hover { color: var(--text-color); }
    </style>
</head>
<body>
    <main class="signin">
        <h1>4L Dashboard</h1>
        <p class="sub">Sign in to manage the roster.</p>

        <form id="signinForm" autocomplete="on">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" value="admin" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            </div>
            <button type="submit" id="signinButton">Sign in</button>
            <p class="msg" id="signinMessage" role="status" aria-live="polite"></p>
        </form>

        <a class="back" href="/">&larr; Back to the dashboard</a>
    </main>

<script>
    // Where to go afterwards. Read here and validated again on the server,
    // because anything in a query string is the visitor's to set.
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "/roster";

    const form = document.getElementById("signinForm");
    const button = document.getElementById("signinButton");
    const message = document.getElementById("signinMessage");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        message.textContent = "";

        let response;
        try {
            response = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value,
                    next,
                }),
            });
        } catch (e) {
            message.textContent = "Couldn't reach the server.";
            button.disabled = false;
            return;
        }

        if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            message.textContent = body.detail || `Sign in failed (${response.status}).`;
            button.disabled = false;
            document.getElementById("password").select();
            return;
        }

        const body = await response.json();
        // replace(), not assign(): the login should not sit in the back stack,
        // where Back would land on a form that is no longer needed.
        location.replace(body.next || "/roster");
    });
</script>
</body>
</html>
